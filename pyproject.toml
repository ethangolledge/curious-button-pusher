[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "content"
version = "0.1.0"
description = "Turn a true story into a narrated video: research, script, fact-check, storyboard and produce, with a person directing at every paid step"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.4,<2",
  "pydantic>=2.12,<3",
  "python-dotenv>=1.0,<2",
  "textstat>=0.7,<1",
  "numpy>=2,<3",
]

[project.optional-dependencies]
# OpenRouter: every text model through the OpenAI-compatible client, and Jev over HTTP.
live = ["openai>=1.68,<3", "httpx>=0.27,<1"]
# Our own small decision models: local sentence embeddings and a numpy classifier.
learn = ["fastembed>=0.5,<1"]
# Mapping a locked music bed's beats and bars (Beat This!), run once per track. Install
# PyTorch's CPU build first: pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
music = [
  "beat-this @ https://github.com/CPJKU/beat_this/archive/main.zip",
  "einops",
  "soxr",
  "rotary-embedding-torch",
]
# Reading the COLLADA models some free collections (Gazebo Fuel) are made of.
models = ["trimesh>=4.4", "pycollada>=0.8"]
# Keeping finished runs and the theme's locks in a Google Cloud Storage bucket (storage.py).
cloud = ["google-cloud-storage>=3.4,<4"]
# Published vision models (`providers/vision.py`): each keyframe's focal point (Grounding
# DINO), and lifting a keyframe into depth for picture shots (MoGe-2, SAM 2, ViTPose, LaMa).
# Install PyTorch and torchvision's CPU builds first (a GPU's when there is one):
#   pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
vision = [
  "transformers>=5,<6",
  "pillow>=10",
  "onnxruntime>=1.20",
  "huggingface-hub>=1",
  "opencv-python-headless>=4.10",
  "scipy>=1.13",
  "moge @ git+https://github.com/microsoft/MoGe.git",
]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
]

[project.scripts]
content = "content.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["content*"]
namespaces = true

[tool.setuptools.package-data]
# Every prompt (`prompt.md`, `<job>_prompt.md`) and page asset (script, style) ships with it.
"*" = ["*.md", "*.js", "*.css"]

[tool.pytest.ini_options]
# Whole-video renders take about 40 s each: run them with `pytest -m video` before a release
# or after changing production code. Everything else runs by default in well under a minute.
addopts = "-q -m 'not video'"
markers = ["video: renders a whole video with ffmpeg (slow; run with `pytest -m video`)"]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"  # numpy's type stubs need 3.12 syntax
files = ["src", "tests"]
strict = true
plugins = ["pydantic.mypy"]
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["openai", "textstat", "fastembed", "onnxruntime", "nltk", "beat_this.*", "transformers", "torch", "PIL.*", "google.cloud.*", "moge.*", "huggingface_hub", "scipy.*"]
ignore_missing_imports = true
